# localstore project homepage
# Certificates are issued and renewed by the existing /usr/local/acme.sh setup.
server {
    listen 80;
    listen [::]:80;
    server_name localstore.liuguofeng.com;

    location ^~ /.well-known/acme-challenge/ {
        root /home/wwwroot/default;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://localstore.liuguofeng.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name localstore.liuguofeng.com;

    root /home/wwwroot/localstore.liuguofeng.com;
    index index.html;

    ssl_certificate /usr/local/nginx/conf/ssl/localstore.liuguofeng.com/fullchain.cer;
    ssl_certificate_key /usr/local/nginx/conf/ssl/localstore.liuguofeng.com/localstore.liuguofeng.com.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:LOCALSTORESSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ^~ /.well-known/acme-challenge/ {
        root /home/wwwroot/default;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
