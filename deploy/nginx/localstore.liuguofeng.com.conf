# localstore project homepage
# The domain currently serves HTTP until a certificate is provisioned.
server {
    listen 80;
    listen [::]:80;
    server_name localstore.liuguofeng.com;

    root /home/wwwroot/localstore.liuguofeng.com;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /home/wwwroot/default;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
