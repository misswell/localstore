<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>localstore · 请求日志</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <div class="eyebrow"><span class="pulse"></span> LOOPBACK MONITOR</div>
        <h1>请求日志</h1>
        <p>观察 localstore 的实时读写与历史请求轨迹。</p>
      </div>
      <div class="monitor">
        <div class="port"><small id="host">127.0.0.1 :</small><strong id="port">7777</strong></div>
        <div class="status" id="status" role="status" aria-live="polite"><span></span>正在连接</div>
      </div>
    </header>

    <section class="stats" aria-label="请求统计">
      <article><span>总请求</span><strong id="total">—</strong></article>
      <article><span>成功</span><strong id="success">—</strong></article>
      <article><span>错误</span><strong id="errors">—</strong></article>
      <article><span>平均耗时</span><strong id="average">—</strong></article>
    </section>

    <section class="panel">
      <div class="toolbar">
        <div>
          <h2>活动记录</h2>
          <p>最多保留最近 1,000 条</p>
        </div>
        <div class="controls">
          <select id="method" aria-label="按请求方法筛选">
            <option value="">全部方法</option>
            <option>GET</option><option>POST</option><option>DELETE</option>
          </select>
          <input id="search" type="search" placeholder="筛选路径…" aria-label="筛选路径">
          <button id="refresh" type="button">立即刷新</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr><th>时间</th><th>方法</th><th>路径</th><th>状态</th><th>耗时</th><th>来源</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden>
          <div class="empty-icon">⌁</div>
          <strong>还没有请求</strong>
          <span>调用 /set/:key 或 /get/:key 后，记录会出现在这里。</span>
        </div>
      </div>
    </section>
  </main>
  <script src="/dashboard.js" defer></script>
</body>
</html>
